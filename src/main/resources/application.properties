spring.application.name=mini-erp
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/mini_erp?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

# JWT
# L'ancienne clé était trop courte (17 caractères).
# jwt.secret=MaCleSuperSecrete

# NOUVEAU SECRET (minimum 32 caractères pour HS256)
jwt.secret=QzJ6RjM3SHlWNEFqNUJsUEdYc3E5WmR4RmQ3NkNhZg
# Cette chaîne fait 44 caractères, ce qui est sûr.

jwt.expiration=86400000

# Fichier uploads
file.upload-dir=uploads/invoices


# Taille maximale pour un fichier
spring.servlet.multipart.max-file-size=10MB
# Taille maximale pour la requête HTTP (fichier + autres données)
spring.servlet.multipart.max-request-size=10MB
