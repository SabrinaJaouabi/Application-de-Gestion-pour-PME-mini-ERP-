<div class="container mt-4">
  <h2>Ajouter un Produit</h2>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <!-- Image Upload -->
    <div class="mb-4">
      <label class="form-label fw-bold">Image du produit</label>
      <input type="file" class="form-control" accept="image/*" (change)="onFileSelected($event)" />

      <div class="mt-3" *ngIf="imagePreview">
        <p class="text-muted small">Aperçu :</p>
        <img [src]="imagePreview" alt="Aperçu" class="img-preview" />
      </div>
    </div>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>SKU (Référence unique)</mat-label>
      <input matInput formControlName="sku" required placeholder="ex: TSH-BLEU-M" />
      <mat-hint>Code unique (ex: TSH-BLEU-M)</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="4"></textarea>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Prix (DT)</mat-label>
      <input matInput type="number" formControlName="price" required />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Stock initial</mat-label>
      <input matInput type="number" formControlName="stock" />
    </mat-form-field>

    <div class="button-group mt-4">
      <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid">
        Ajouter le produit
      </button>
      <button mat-button type="button" routerLink="/products" class="ms-2">
        Annuler
      </button>
    </div>
  </form>
</div>
