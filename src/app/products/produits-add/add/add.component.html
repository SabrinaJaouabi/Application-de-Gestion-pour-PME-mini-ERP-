<div class="container mt-4">
  <h2>Ajouter un Produit</h2>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description"></textarea>
    </mat-form-field>
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>SKU (Référence unique)</mat-label>
      <input matInput formControlName="sku" required placeholder="ex: TSH-BLEU-M" />
      <mat-hint>Code unique pour identifier le produit (ex: TSH-BLEU-M)</mat-hint>
      <mat-error *ngIf="productForm.get('sku')?.hasError('required')">
        Le SKU est obligatoire
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Prix</mat-label>
      <input matInput type="number" formControlName="price" required />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Stock</mat-label>
      <input matInput type="number" formControlName="stock" />
    </mat-form-field>

    <div class="button-group">
  <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid">
    Ajouter
  </button>
  <button mat-button type="button" routerLink="/products">
    Annuler
  </button>
</div>
  </form>
</div>
