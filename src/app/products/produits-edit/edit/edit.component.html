<div class="container mt-4">
  <h2>Modifier le Produit</h2>

  <div *ngIf="loading" class="text-center mt-5">
    <p>Chargement du produit...</p>
  </div>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
    <!-- Image Upload -->
    <div class="mb-4">
      <label class="form-label fw-bold">Image du produit</label>
      <input type="file" class="form-control" accept="image/*" (change)="onFileSelected($event)" />

      <div class="mt-3" *ngIf="imagePreview">
        <p class="text-muted small">Aperçu :</p>
        <img [src]="imagePreview" alt="Aperçu" class="img-preview" />
      </div>
    </div>

    <!-- Autres champs du produit -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>SKU</mat-label>
      <input matInput formControlName="sku" required />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description"></textarea>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Prix</mat-label>
      <input matInput type="number" formControlName="price" required />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Stock</mat-label>
      <input matInput type="number" formControlName="stock" />
    </mat-form-field>

    <div class="mt-3">
      <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid">
        Enregistrer les modifications
      </button>
      <button mat-button type="button" (click)="onCancel()" class="ms-2">Annuler</button>
    </div>
  </form>
</div>
