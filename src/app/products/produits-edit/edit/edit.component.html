<div class="container mt-4">
  <h2>Modifier le Produit</h2>

  <div *ngIf="loading" class="text-center mt-5">
    <p>Chargement du produit...</p>
  </div>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" required />
      <mat-error *ngIf="productForm.get('name')?.hasError('required')">
        Le nom est obligatoire
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>SKU (Référence unique)</mat-label>
      <input matInput formControlName="sku" required />
      <mat-error *ngIf="productForm.get('sku')?.hasError('required')">
        Le SKU est obligatoire
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description"></textarea>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Prix</mat-label>
      <input matInput type="number" formControlName="price" required />
      <mat-error *ngIf="productForm.get('price')?.hasError('required')">
        Le prix est obligatoire
      </mat-error>
      <mat-error *ngIf="productForm.get('price')?.hasError('min')">
        Le prix doit être positif
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Stock</mat-label>
      <input matInput type="number" formControlName="stock" />
    </mat-form-field>

    <div class="mt-3">
      <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid">
        Enregistrer les modifications
      </button>
      <button mat-button type="button" (click)="onCancel()" class="ms-2">
        Annuler
      </button>
    </div>
  </form>
</div>
