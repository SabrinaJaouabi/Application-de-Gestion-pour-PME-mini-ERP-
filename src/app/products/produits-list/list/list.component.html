<div class="container mt-4">
  <h2>Liste des Produits</h2>

  <div class="mb-3" *ngIf="isAdmin">
    <button mat-raised-button color="primary" routerLink="/products/add">
      Ajouter un produit
    </button>
  </div>

  <table mat-table [dataSource]="products" class="mat-elevation-z8">

    <!-- Colonne SKU -->
    <ng-container matColumnDef="sku">
      <th mat-header-cell *matHeaderCellDef> SKU </th>
      <td mat-cell *matCellDef="let product"> {{ product.sku || '-' }} </td>
    </ng-container>

    <!-- Colonne Nom -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nom </th>
      <td mat-cell *matCellDef="let product"> {{ product.name }} </td>
    </ng-container>

    <!-- Colonne Prix -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef> Prix </th>
      <td mat-cell *matCellDef="let product"> {{ product.price }} € </td>
    </ng-container>

    <!-- Colonne Stock -->
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef> Stock </th>
      <td mat-cell *matCellDef="let product"> {{ product.stock }} </td>
    </ng-container>

    <!-- Colonne Actions (seulement pour admin) -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let product">
        <button mat-icon-button color="primary" [routerLink]="['/products/edit', product.id]">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteProduct(product.id!)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- ======================================== -->
    <!-- Rows pour ADMIN (avec toutes les colonnes) -->
    <!-- ======================================== -->
    <ng-container *ngIf="isAdmin">
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </ng-container>

    <!-- ======================================== -->
    <!-- Rows pour USER (sans la colonne Actions) -->
    <!-- ======================================== -->
    <ng-container *ngIf="!isAdmin">
      <tr mat-header-row *matHeaderRowDef="userColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: userColumns"></tr>
    </ng-container>

  </table>

  <p *ngIf="products.length === 0" class="text-center mt-4">Aucun produit disponible.</p>
</div>
