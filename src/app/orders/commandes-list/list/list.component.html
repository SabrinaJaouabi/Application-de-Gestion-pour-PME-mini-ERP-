<div class="container mt-4">
  <h2>Liste des Commandes (Admin)</h2>

  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && orders.length === 0" class="alert alert-info">
    Aucune commande trouvée.
  </div>

  <div *ngIf="!loading && orders.length > 0" class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Date</th>
          <th>Client</th>
          <th>Articles</th>
          <th>Total</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td>{{ order.id }}</td>
          <td>{{ order.orderDate | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ getFullName(order) }}</td>
          <td>{{ order.items.length || 0 }}</td>
          <td>{{ order.totalAmount | currency:'EUR' }}</td>
          <td>
            <button class="btn btn-sm btn-danger" (click)="deleteOrder(order.id!)">
              Supprimer
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
