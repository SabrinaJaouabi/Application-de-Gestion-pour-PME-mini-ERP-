<div class="card mb-3 shadow-sm" *ngFor="let order of orders">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div>
      <strong>Commande #{{ order.id }}</strong> - {{ order.orderDate | date:'medium' }}
    </div>
    <span class="badge bg-success">Total: {{ order.totalAmount | currency:'TND':'symbol':'1.2-2' }}</span>
  </div>

  <div class="card-body">
    <ul class="list-group list-group-flush mb-3">
      <li class="list-group-item" *ngFor="let item of order.items">
        {{ item.product.name }} × {{ item.quantity }} = {{ (item.price * item.quantity) | currency:'TND':'symbol':'1.2-2' }}
      </li>
    </ul>

    <!-- Payer -->
    <button *ngIf="!order.paid" class="btn btn-primary" (click)="pay(order.id)">
      💳 Payer
    </button>

    <!-- Télécharger facture -->
    <button *ngIf="order.paid" class="btn btn-outline-success" (click)="downloadInvoice(order.id)">
      📄 Télécharger facture
    </button>
  </div>
</div>
