<div class="register-container">

  <div class="card">
    <h2>Create Account</h2>

    <form [formGroup]="registerForm" (ngSubmit)="register()">

      <div class="form-group">
        <label>Username</label>
        <input formControlName="username" type="text" placeholder="Enter username">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="Enter email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input formControlName="password" type="password" placeholder="Enter password">
      </div>

      <div class="form-group">
        <label>Role</label>
        <select formControlName="role">
          <option value="USER">User</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>

      <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>

      <p class="login-link">
        Already have an account? <a routerLink="/login">Login</a>
      </p>
    </form>
  </div>

</div>
